<div class="relative min-h-[calc(100vh-8rem)] flex items-center justify-center p-6 overflow-hidden">
  <!-- Animated background orbs -->
  <div
    class="absolute top-1/4 left-1/4 w-72 h-72 bg-indigo-500/10 rounded-full blur-3xl animate-pulse"
  ></div>
  <div
    class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-pink-500/10 rounded-full blur-3xl animate-pulse"
    style="animation-delay: 1s"
  ></div>
  <div
    class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-purple-500/5 rounded-full blur-3xl"
  ></div>

  <!-- Dashboard Card -->
  <div
    class="relative w-full max-w-2xl rounded-3xl p-10 md:p-14 text-center overflow-hidden border border-slate-700/40 bg-slate-900/60 backdrop-blur-2xl shadow-2xl shadow-indigo-500/10 animate-fadeUp"
  >
    <!-- Decorative top gradient line -->
    <div
      class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"
    ></div>

    <div class="relative">
      <!-- Live indicator -->
      <div class="flex items-center justify-center gap-2 mb-8">
        <span class="relative flex h-3 w-3">
          <span
            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"
          ></span>
          <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
        </span>
        <span class="text-emerald-400 text-sm font-semibold tracking-widest uppercase">Live</span>
      </div>

      <!-- Icon -->
      <div class="flex justify-center mb-6">
        <div
          class="w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500/20 to-pink-500/20 flex items-center justify-center border border-slate-600/30"
        >
          <svg
            class="w-8 h-8 text-indigo-400"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"
            />
          </svg>
        </div>
      </div>

      <!-- Label -->
      <p class="text-slate-400 text-lg font-medium mb-2 tracking-wide">Total Users Reached</p>

      <!-- Count -->
      <div class="my-6">
        <span
          class="text-8xl md:text-9xl font-extrabold tabular-nums tracking-tighter text-transparent bg-clip-text bg-gradient-to-b from-white via-indigo-200 to-indigo-400/60"
        >
          {{ displayedCount }}
        </span>
      </div>

      <!-- Decorative divider -->
      <div class="flex items-center justify-center gap-3 mb-8">
        <span class="h-px w-12 bg-gradient-to-r from-transparent to-slate-600"></span>
        <span class="text-slate-500 text-xs tracking-widest">REALTIME</span>
        <span class="h-px w-12 bg-gradient-to-l from-transparent to-slate-600"></span>
      </div>

      <!-- Subtext -->
      <p class="text-slate-500 text-sm mb-10 max-w-md mx-auto leading-relaxed">
        Every visitor who enters their name is counted here in real time.
      </p>

      <!-- Back Button -->
      <button
        (click)="goHome()"
        class="px-8 py-3.5 rounded-xl text-white font-semibold bg-gradient-to-r from-indigo-600 to-pink-500 hover:opacity-90 hover:scale-[1.02] active:scale-[0.97] transition-all duration-200 shadow-lg shadow-indigo-500/20"
      >
        Back to Home
      </button>
    </div>
  </div>
</div>
