<div
  class="h-screen flex flex-col"
  [class.dark]="themeMode === 'dark'"
  [ngClass]="themeMode === 'dark' ? 'bg-slate-950 text-gray-100' : 'bg-[#f5f6fb] text-gray-900'"
>
  <!-- Header -->
  <header
    class="flex justify-between items-center px-10 py-4 border-b shadow-sm sticky top-0 z-10"
    [ngClass]="
      themeMode === 'dark' ? 'bg-slate-900 border-slate-700' : 'bg-white/90 border-gray-200'
    "
  >
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-r from-indigo-600 to-purple-500"></div>
      <h1
        class="text-lg font-semibold"
        [ngClass]="themeMode === 'dark' ? 'text-gray-100' : 'text-gray-700'"
      >
        ToneCraft AI
      </h1>
    </div>
    <div class="flex items-center gap-4">
      <button
        (click)="toggleTheme()"
        class="px-4 py-1.5 rounded-lg text-sm font-medium text-gray-600 hover:text-gray-800 hover:bg-gray-100 dark:text-gray-400 dark:hover:text-gray-200 dark:hover:bg-gray-700 transition duration-200"
        [title]="themeMode === 'light' ? 'Switch to Dark Mode' : 'Switch to Light Mode'"
      >
        {{ themeMode === 'light' ? 'Light' : 'Dark' }}
      </button>

      <span
        class="text-sm font-medium"
        [ngClass]="themeMode === 'dark' ? 'text-gray-200' : 'text-gray-700'"
      >
        Mode: {{ themeMode | titlecase }}
      </span>

      <button
        class="px-4 py-1.5 rounded-lg text-white font-medium bg-gradient-to-r from-indigo-600 to-pink-500 hover:opacity-90 hover:scale-[1.02] active:scale-[0.97] transition duration-200"
      >
        Sign In
      </button>
    </div>
  </header>

  <!-- MAIN CONTENT (IMPORTANT) -->
  <main class="flex-1 overflow-y-auto">
    <!-- Input Section -->
    <div
      class="max-w-4xl mx-auto mt-12 rounded-2xl shadow-md p-6 animate-fadeUp"
      [style.backgroundColor]="themeMode === 'dark' ? '#1e293b' : '#ffffff'"
      [style.color]="themeMode === 'dark' ? '#f3f4f6' : '#111827'"
    >
      <textarea
        [(ngModel)]="inputText"
        placeholder="Type your message here to improve..."
        class="w-full h-32 rounded-xl p-4 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 resize-none scrollbar-thin scrollbar-track-gray-100 dark:scrollbar-track-gray-700 scrollbar-thumb-indigo-500 scrollbar-thumb-rounded border"
        [style.backgroundColor]="themeMode === 'dark' ? '#0f172a' : '#ffffff'"
        [style.color]="themeMode === 'dark' ? '#f3f4f6' : '#111827'"
        [style.borderColor]="themeMode === 'dark' ? '#3f3f46' : '#e5e7eb'"
      ></textarea>

      <div class="relative w-44">
        <!-- Selected -->
        <button
          (click)="toggleDropdown('filter')"
          class="w-full flex justify-between items-center px-4 py-2 rounded-lg text-sm hover:shadow-sm transition border"
          [style.backgroundColor]="themeMode === 'dark' ? '#1e293b' : '#ffffff'"
          [style.color]="themeMode === 'dark' ? '#f3f4f6' : '#111827'"
          [style.borderColor]="themeMode === 'dark' ? '#3f3f46' : '#e5e7eb'"
        >
          <span>{{ filterTone }}</span>
          <span>▾</span>
        </button>

        <!-- Options -->
        <div
          *ngIf="activeDropdown === 'filter'"
          class="absolute mt-2 w-full rounded-lg shadow-lg z-10 animate-scaleIn border"
          [style.backgroundColor]="themeMode === 'dark' ? '#1e293b' : '#ffffff'"
          [style.borderColor]="themeMode === 'dark' ? '#3f3f46' : '#e5e7eb'"
          [style.color]="themeMode === 'dark' ? '#f3f4f6' : '#111827'"
        >
          <div
            *ngFor="let f of ['All', 'Professional', 'Friendly', 'Polite']"
            (click)="selectFilter(f)"
            class="px-4 py-2 text-sm cursor-pointer transition"
            [style.color]="themeMode === 'dark' ? '#f3f4f6' : '#111827'"
            (mouseenter)="onFilterMouseEnter($event)"
            (mouseleave)="onFilterMouseLeave($event)"
          >
            {{ f }}
          </div>
        </div>
      </div>

      <button
        (click)="generate()"
        [disabled]="!inputText"
        class="mt-6 w-full py-3 rounded-xl text-white font-medium bg-gradient-to-r from-indigo-600 to-pink-500 hover:opacity-90 hover:scale-[1.02] active:scale-[0.97] transition duration-200"
      >
        Improve Message
      </button>
    </div>

    <!-- Loader -->
    <div *ngIf="loading" class="flex justify-center mt-6">
      <div
        class="flex items-center gap-2 animate-pulse"
        [ngClass]="themeMode === 'dark' ? 'text-gray-400' : 'text-gray-500'"
      >
        <span class="w-2 h-2 bg-indigo-500 rounded-full animate-bounce"></span>
        <span class="w-2 h-2 bg-purple-500 rounded-full animate-bounce delay-150"></span>
        <span class="w-2 h-2 bg-pink-500 rounded-full animate-bounce delay-300"></span>
        <span>Improving your message...</span>
      </div>
    </div>

    <!-- Results -->
    <div
      *ngIf="results.length > 0"
      class="max-w-6xl mx-auto mt-10 gap-6 px-6 pb-10"
      [ngClass]="getFilteredResults().length === 1 ? 'flex justify-center' : 'grid md:grid-cols-3'"
    >
      <div
        *ngFor="let r of getFilteredResults()"
        (click)="openPopup(r)"
        [ngClass]="getFilteredResults().length === 1 ? 'w-full max-w-2xl' : ''"
        class="rounded-xl shadow-sm p-5 flex flex-col justify-between animate-scaleIn hover:shadow-lg transition duration-200 cursor-pointer border"
        [style.backgroundColor]="themeMode === 'dark' ? '#1e293b' : '#ffffff'"
        [style.color]="themeMode === 'dark' ? '#f3f4f6' : '#111827'"
        [style.borderColor]="themeMode === 'dark' ? '#3f3f46' : '#e5e7eb'"
      >
        <div
          class="flex items-center gap-2 mb-3 font-semibold"
          [style.color]="themeMode === 'dark' ? '#f3f4f6' : '#374151'"
        >
          <span>💼</span>
          <span>{{ r.title }}</span>
        </div>

        <p
          class="text-sm leading-relaxed line-clamp-3"
          [style.color]="themeMode === 'dark' ? '#d1d5db' : '#4b5563'"
        >
          {{ r.text }}
        </p>

        <button
          (click)="copy(r.text)"
          class="mt-6 w-full py-3 rounded-xl text-white font-medium bg-gradient-to-r from-indigo-600 to-pink-500 hover:opacity-90 hover:scale-[1.02] active:scale-[0.97] transition duration-200"
        >
          Copy
        </button>
      </div>
    </div>
  </main>

  <!-- Popup Modal -->
  <div
    *ngIf="selectedResult"
    class="fixed inset-0 backdrop-blur-sm bg-gradient-to-b from-transparent via-transparent to-black/10 flex items-center justify-center z-50 animate-fadeIn"
  >
    <div
      class="rounded-2xl p-6 max-w-2xl w-full mx-4 max-h-[80vh] overflow-y-auto shadow-2xl shadow-indigo-500/50 animate-scaleIn"
      [style.backgroundColor]="themeMode === 'dark' ? '#0f172a' : '#ffffff'"
      [style.color]="themeMode === 'dark' ? '#f3f4f6' : '#111827'"
    >
      <div class="flex justify-between items-center mb-4">
        <h2
          class="text-lg font-semibold"
          [style.color]="themeMode === 'dark' ? '#f3f4f6' : '#374151'"
        >
          {{ selectedResult.title }}
        </h2>
        <button
          (click)="closePopup()"
          class="text-2xl"
          [ngClass]="
            themeMode === 'dark'
              ? 'text-gray-400 hover:text-gray-200'
              : 'text-gray-500 hover:text-gray-700'
          "
        >
          &times;
        </button>
      </div>
      <p
        class="text-sm leading-relaxed mb-6"
        [style.color]="themeMode === 'dark' ? '#d1d5db' : '#4b5563'"
      >
        {{ selectedResult.text }}
      </p>
      <button
        (click)="copy(selectedResult.text)"
        class="w-full py-3 rounded-xl text-white font-medium bg-gradient-to-r from-indigo-600 to-pink-500 hover:opacity-90 hover:scale-[1.02] active:scale-[0.97] transition duration-200"
      >
        Copy
      </button>
    </div>
  </div>

  <!-- Footer (NOW FIXED) -->
  <footer
    class="text-center py-6 text-sm"
    [ngClass]="themeMode === 'dark' ? 'text-gray-400' : 'text-gray-500'"
  >
    <div class="mt-3 text-xs" [ngClass]="themeMode === 'dark' ? 'text-gray-500' : 'text-gray-400'">
      © 2026 ToneCraft AI · Open Source under MIT License
    </div>
  </footer>
</div>
