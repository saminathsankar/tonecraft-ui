<div class="h-screen flex flex-col bg-[#f5f6fb]">
  <!-- Header -->
  <header class="flex justify-between items-center px-10 py-4 bg-white shadow-sm sticky top-0 z-10">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-r from-indigo-600 to-purple-500"></div>
      <h1 class="text-lg font-semibold text-gray-700">ToneCraft AI</h1>
    </div>

    <button
      class="px-4 py-1.5 rounded-lg text-white font-medium bg-gradient-to-r from-indigo-600 to-pink-500 hover:opacity-90 hover:scale-[1.02] active:scale-[0.97] transition duration-200"
    >
      Sign In
    </button>
  </header>

  <!-- MAIN CONTENT (IMPORTANT) -->
  <main class="flex-1 overflow-y-auto">
    <!-- Input Section -->
    <div class="max-w-4xl mx-auto mt-12 bg-white rounded-2xl shadow-md p-6 animate-fadeUp">
      <textarea
        [(ngModel)]="inputText"
        placeholder="Type your message here to improve..."
        class="w-full h-32 border border-gray-200 rounded-xl p-4 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
      ></textarea>

      <div class="relative w-44">
        <!-- Selected -->
        <button
          (click)="toggleDropdown('tone')"
          class="w-full flex justify-between items-center px-4 py-2 bg-white border border-gray-200 rounded-lg text-sm hover:shadow-sm transition"
        >
          <span>{{ tone }}</span>
          <span>▾</span>
        </button>

        <!-- Options -->
        <div
          *ngIf="activeDropdown === 'tone'"
          class="absolute mt-2 w-full bg-white border border-gray-200 rounded-lg shadow-lg z-10 animate-scaleIn"
        >
          <div
            *ngFor="let t of ['Professional', 'Friendly', 'Polite']"
            (click)="selectTone(t)"
            class="px-4 py-2 text-sm hover:bg-indigo-50 cursor-pointer transition"
          >
            {{ t }}
          </div>
        </div>
      </div>

      <button
        (click)="generate()"
        [disabled]="!inputText"
        class="mt-6 w-full py-3 rounded-xl text-white font-medium bg-gradient-to-r from-indigo-600 to-pink-500 hover:opacity-90 hover:scale-[1.02] active:scale-[0.97] transition duration-200"
      >
        Improve Message
      </button>
    </div>

    <!-- Loader -->
    <div *ngIf="loading" class="flex justify-center mt-6">
      <div class="flex items-center gap-2 text-gray-500 animate-pulse">
        <span class="w-2 h-2 bg-indigo-500 rounded-full animate-bounce"></span>
        <span class="w-2 h-2 bg-purple-500 rounded-full animate-bounce delay-150"></span>
        <span class="w-2 h-2 bg-pink-500 rounded-full animate-bounce delay-300"></span>
        <span>Improving your message...</span>
      </div>
    </div>

    <!-- Results -->
    <div class="max-w-6xl mx-auto mt-10 grid md:grid-cols-3 gap-6 px-6 pb-10">
      <div
        *ngFor="let r of results"
        class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 flex flex-col justify-between animate-scaleIn hover:shadow-lg transition duration-200"
      >
        <div class="flex items-center gap-2 mb-3 text-gray-700 font-semibold">
          <span>💼</span>
          <span>{{ r.title }}</span>
        </div>

        <p class="text-gray-600 text-sm leading-relaxed">
          {{ r.text }}
        </p>

        <button
          (click)="copy(r.text)"
          class="mt-6 w-full py-3 rounded-xl text-white font-medium bg-gradient-to-r from-indigo-600 to-pink-500 hover:opacity-90 hover:scale-[1.02] active:scale-[0.97] transition duration-200"
        >
          Copy
        </button>
      </div>
    </div>
  </main>

  <!-- Footer (NOW FIXED) -->
  <footer class="text-center py-6 text-gray-500 text-sm">
    <div class="mt-3 text-xs text-gray-400">
      © 2026 ToneCraft AI · Open Source under MIT License
    </div>
  </footer>
</div>
